# ============================================================
# CricZodiac — Nginx config INSIDE Docker container
# Proxied from host Nginx on port 8090
# ============================================================

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index public/index.php index.php index.html;

    # ── API routes ─────────────────────────────────────────
    location /api/ {
        try_files $uri $uri/ =404;

        # CORS headers for React Native app
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # ── PHP processing ─────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_AUTHORIZATION $http_authorization;
        include        fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
    }

    # ── Uploaded files (profile pictures) ─────────────────
    location /uploads/ {
        alias /var/www/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header 'Access-Control-Allow-Origin' '*';
    }

    # ── Health check ───────────────────────────────────────
    location /health {
        return 200 '{"status":"ok","service":"CricZodiac API","version":"1.0"}';
        add_header Content-Type application/json;
    }

    # ── Block sensitive files ──────────────────────────────
    location ~* \.(sql|log|env|conf|sh|git)$ {
        deny all;
        return 404;
    }

    location ~ /\.git {
        deny all;
        return 404;
    }

    client_max_body_size 10M;

    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log combined;

    gzip on;
    gzip_types application/json text/plain;
}
