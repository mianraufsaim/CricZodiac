buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26 // react-native-vision-camera requires API 26+
        compileSdkVersion = 36
        targetSdkVersion = 36 // Google Play requires app updates to target API 36 from August 31, 2026
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // The React Native plugin pins an Android 16 compatible AGP version.
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Firebase (@react-native-firebase) — Google Services plugin
        classpath("com.google.gms:google-services:4.4.1")
    }
}

apply plugin: "com.facebook.react.rootproject"
